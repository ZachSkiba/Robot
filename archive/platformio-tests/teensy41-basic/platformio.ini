
[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 250000

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = esptool
monitor_speed = 250000
monitor_rts = 0
monitor_dtr = 0

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 250000

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_protocol = arduino
monitor_speed = 250000
